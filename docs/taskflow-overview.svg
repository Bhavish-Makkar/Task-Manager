<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">TaskFlow architecture and permissions</title><desc id="desc">User, Project, Task and Comment relationships; project owner and assigned member access; dashboard queries and index evidence.</desc><rect width="1200" height="1000" fill="#ffffff"/><g font-family="Arial, sans-serif" fill="#172033"><text x="40" y="40" font-size="28" font-weight="700">TaskFlow | Architecture &amp; access overview</text><text x="40" y="102" font-size="15" font-weight="700">01   DATA MODEL</text><text x="40" y="445" font-size="15" font-weight="700">02   PROJECT MEMBERSHIP &amp; PERMISSIONS</text><text x="40" y="700" font-size="15" font-weight="700">03   DASHBOARD &amp; DATABASE QUERIES</text><rect x="40" y="150" width="235" height="200" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="56" y="180" font-size="18" font-weight="700">Django User</text><text x="56" y="211" font-size="13" fill="#334155">Built-in authentication</text><text x="56" y="234" font-size="13" fill="#334155">id / username / email</text><text x="56" y="257" font-size="13" fill="#334155">Register → Login → Session</text><text x="56" y="280" font-size="13" fill="#334155">POST logout</text><text x="56" y="303" font-size="13" fill="#334155">Admin: separate staff interface</text><rect x="335" y="150" width="235" height="200" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="351" y="180" font-size="18" font-weight="700">Project</text><text x="351" y="211" font-size="13" fill="#334155">id · name · description</text><text x="351" y="234" font-size="13" fill="#334155">owner → User (required)</text><text x="351" y="257" font-size="13" fill="#334155">One owner, many projects</text><text x="351" y="280" font-size="13" fill="#334155">Owner set by server</text><rect x="630" y="150" width="235" height="200" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="646" y="180" font-size="18" font-weight="700">Task</text><text x="646" y="211" font-size="13" fill="#334155">id · title · due_date</text><text x="646" y="234" font-size="13" fill="#334155">project → Project (required)</text><text x="646" y="257" font-size="13" fill="#334155">assigned_to → User (nullable)</text><text x="646" y="280" font-size="13" fill="#334155">To Do / In Progress / Done</text><text x="646" y="303" font-size="13" fill="#334155">Low / Medium / High</text><rect x="925" y="150" width="235" height="200" rx="12" fill="#eef2ff" stroke="#cbd5e1"/><text x="941" y="180" font-size="18" font-weight="700">Comment</text><text x="941" y="211" font-size="13" fill="#334155">id · body · timestamp (auto)</text><text x="941" y="234" font-size="13" fill="#334155">task → Task (required)</text><text x="941" y="257" font-size="13" fill="#334155">author → User (required)</text><text x="941" y="280" font-size="13" fill="#334155">Append-only in normal app</text><text x="941" y="303" font-size="13" fill="#334155">Author and task set by server</text><rect x="40" y="490" width="350" height="160" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/><text x="56" y="520" font-size="18" font-weight="700">Project owner</text><text x="56" y="551" font-size="13" fill="#334155">View project and all its tasks</text><text x="56" y="574" font-size="13" fill="#334155">Create / edit / delete tasks</text><text x="56" y="597" font-size="13" fill="#334155">Edit / delete project</text><text x="56" y="620" font-size="13" fill="#334155">Read and add comments</text><rect x="425" y="490" width="350" height="160" rx="12" fill="#eff6ff" stroke="#cbd5e1"/><text x="441" y="520" font-size="18" font-weight="700">Assigned project member</text><text x="441" y="551" font-size="13" fill="#334155">Assigned at least one task in project</text><text x="441" y="574" font-size="13" fill="#334155">View ALL tasks; read / add comments</text><text x="441" y="597" font-size="13" fill="#334155">No project or task management</text><text x="441" y="620" font-size="13" fill="#334155">Last assignment removed → access lost</text><rect x="810" y="490" width="350" height="160" rx="12" fill="#fff7ed" stroke="#cbd5e1"/><text x="826" y="520" font-size="18" font-weight="700">Access enforcement</text><text x="826" y="551" font-size="13" fill="#334155">Unrelated user → access denied</text><text x="826" y="574" font-size="13" fill="#334155">Anonymous user → login required</text><text x="826" y="597" font-size="13" fill="#334155">Nested task URL checks project + task</text><text x="826" y="620" font-size="13" fill="#334155">GET/POST checks run on the server</text><rect x="40" y="745" width="350" height="205" rx="12" fill="#f5f3ff" stroke="#cbd5e1"/><text x="56" y="775" font-size="18" font-weight="700">My Tasks dashboard</text><text x="56" y="806" font-size="13" fill="#334155">assigned_to = request.user</text><text x="56" y="829" font-size="13" fill="#334155">To Do / In Progress / Done groups</text><text x="56" y="852" font-size="13" fill="#334155">Due date ordering; other users excluded</text><text x="56" y="875" font-size="13" fill="#334155">Overdue: due_date &lt; local today</text><text x="56" y="898" font-size="13" fill="#334155">AND status != DONE</text><text x="56" y="921" font-size="13" fill="#334155">Ownership alone does not include tasks</text><rect x="425" y="745" width="350" height="205" rx="12" fill="#f5f3ff" stroke="#cbd5e1"/><text x="441" y="775" font-size="18" font-weight="700">MySQL + reusable ORM</text><text x="441" y="806" font-size="13" fill="#334155">TaskQuerySet.overdue()</text><text x="441" y="829" font-size="13" fill="#334155">Per-project values(status) + Count(id)</text><text x="441" y="852" font-size="13" fill="#334155">select_related: forward foreign keys</text><text x="441" y="875" font-size="13" fill="#334155">Prefetch: project → tasks</text><text x="441" y="898" font-size="13" fill="#334155">Counts computed in the database</text><text x="441" y="921" font-size="13" fill="#334155">SQL / EXPLAIN evidence: QUERIES.md</text><rect x="810" y="745" width="350" height="205" rx="12" fill="#f5f3ff" stroke="#cbd5e1"/><text x="826" y="775" font-size="18" font-weight="700">One deliberate index</text><text x="826" y="806" font-size="13" fill="#334155">(assigned_to, due_date, status)</text><text x="826" y="829" font-size="13" fill="#334155">Targets user-scoped overdue query</text><text x="826" y="852" font-size="13" fill="#334155">Defined in migration 0002</text><text x="826" y="875" font-size="13" fill="#334155">Automatic PK/FK indexes also exist</text><text x="826" y="898" font-size="13" fill="#334155">Observed plan used existing FK index</text><text x="826" y="921" font-size="13" fill="#334155">Measured speedup not established</text><path d="M275 250 h52" fill="none" stroke="#64748b" stroke-width="2"/><path d="M327 250 l-7 -4 v8 Z" fill="#64748b"/><text x="305" y="238" text-anchor="middle" font-size="10">1 : many</text><path d="M570 250 h52" fill="none" stroke="#64748b" stroke-width="2"/><path d="M622 250 l-7 -4 v8 Z" fill="#64748b"/><text x="600" y="238" text-anchor="middle" font-size="10">1 : many</text><path d="M865 250 h52" fill="none" stroke="#64748b" stroke-width="2"/><path d="M917 250 l-7 -4 v8 Z" fill="#64748b"/><text x="895" y="238" text-anchor="middle" font-size="10">1 : many</text><text x="40" y="397" font-size="13" fill="#475569">Deletion: Project → Tasks → Comments CASCADE. Assignee deleted → SET_NULL. Author deleted → Comments CASCADE.</text></g></svg>
