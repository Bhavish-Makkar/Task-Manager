{% extends "base.html" %}
{% block title %}{{ project.name }} · TaskFlow{% endblock %}
{% block content %}
<section class="dashboard-card">
    <div class="eyebrow">Project</div>
    <h1>{{ project.name }}</h1>
    <p class="helper">Owned by {{ project.owner.username }}</p>
    <p>{{ project.description|default:"No description provided." }}</p>
    <div class="project-actions">
        <button class="btn btn-secondary" type="button" disabled>Edit project</button>
        <button class="btn btn-secondary" type="button" disabled>Delete project</button>
    </div>
    <h2>Tasks</h2>
    <p class="helper">No tasks yet.</p>
</section>
{% endblock %}
