{% extends "base.html" %}
{% block title %}Delete {{ task.title }} · TaskFlow{% endblock %}
{% block content %}
<section class="auth-card">
    <div class="eyebrow">Danger zone</div>
    <h1>Delete task</h1>
    <p>Are you sure you want to delete <strong>“{{ task.title }}”</strong>?</p>
    <p class="helper">Project: {{ task.project.name }}</p>
    <p class="helper">This action cannot be undone.</p>
    <div class="project-actions">
        <a class="btn btn-secondary" href="{% url 'task_detail' task.project.pk task.pk %}">Cancel</a>
        <form method="post" action="{% url 'task_delete' task.project.pk task.pk %}">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Delete task</button>
        </form>
    </div>
</section>
{% endblock %}
